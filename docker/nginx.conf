map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_ssl_verify_depth 3;

    # 启用 Gzip 压缩，大幅减少首次加载的静态资源体积（从 ~6.6MB 压缩至 ~1.4MB）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # 静态资源长期缓存（Vite 构建产物文件名带 hash，可安全长久缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resolve the compose service name at request time so backend recreation
    # does not leave Nginx holding an obsolete container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hosted_backend hosted-backend:3000;
    location ^~ /api/server/ {
        proxy_pass http://$hosted_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Keep API mistakes visible instead of serving the SPA's index.html.
    location /api/ {
        return 404;
    }

    # The app's login endpoints need a same-origin HTTPS proxy. Strip the local
    # prefix as Vite does during development, while retaining query and body.
    location ^~ /api/hortor-ucenter/ {
        proxy_pass https://comb-platform.hortorgames.com/;
        proxy_http_version 1.1;
        proxy_set_header Host ucenter-app-server.hortorgames.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; ALN-AL80 Build/HUAWEIALN-AL80; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/114.0.5735.196 Mobile Safari/537.36";
        proxy_set_header Accept application/json;
        proxy_set_header Content-Type "application/json; charset=utf-8";
        proxy_ssl_server_name on;
        proxy_ssl_name comb-platform.hortorgames.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/weixin-long/ {
        proxy_pass https://long.open.weixin.qq.com/;
        proxy_http_version 1.1;
        proxy_set_header Host long.open.weixin.qq.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "*/*";
        proxy_set_header Referer https://open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name long.open.weixin.qq.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/weixin/ {
        proxy_pass https://open.weixin.qq.com/;
        proxy_http_version 1.1;
        proxy_set_header Host open.weixin.qq.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        proxy_set_header Referer https://open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name open.weixin.qq.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/hortor/ {
        proxy_pass https://comb-platform.hortorgames.com/;
        proxy_http_version 1.1;
        proxy_set_header Host comb-platform.hortorgames.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; 23117RK66C Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/95.0.4638.74 Mobile Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_set_header Connection keep-alive;
        proxy_set_header Content-Type "text/plain; charset=utf-8";
        proxy_set_header Origin https://open.weixin.qq.com;
        proxy_set_header Referer https://open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name comb-platform.hortorgames.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
